id: android-emulator
key: fe46f7ec-33f7-4252-b29c-cf224b8cd1af
version: 2.0.0
type: install
# `type` dit QUAND (build), `scope` dit OÙ : cette recette se pose sur une
# machine, jamais dans un conteneur — l'émulateur exige /dev/kvm et 20 Go.
scope: host
host_usages:
  - tests
  - ressources
  - workspaces
# Vérifiées par le portail AVANT tout téléchargement, en plus du préflight du
# script : sans déclaration, le portail ne peut ni les afficher ni refuser le
# lancement.
preconditions:
  # `path_writable` et non `path_exists` : sur host-test-106-1, /dev/kvm existait
  # mais appartenait au groupe kvm dont l'utilisateur SSH ne faisait pas partie —
  # la précondition passait et l'échec tombait APRÈS le transfert des 20 Go.
  # Inutile de déclarer les deux : writable implique exists, et deux lignes de
  # refus pour une seule cause égarent l'administrateur.
  - path_writable: /dev/kvm
  - disk_free_gb: 30
  - arch: x86_64
description: "Machine de développement Android complète et autonome (dépendances système, JDK 17, Node 20+, SDK/NDK/CMake, AVD, émulateur démarré en headless, dépôt cloné et app buildée) — recette de HOST : exige /dev/kvm et ~30 Go libres, ne convient pas à un conteneur"
options:
  api_level:
    type: string
    default: "35"
    description: "Niveau d'API Android (compileSdk/targetSdk du projet : 35)"
  image_variant:
    type: string
    default: "default"
    description: "Variante d'image système : 'default' (746 Mo, sans services Google) ou 'google_apis' (1658 Mo)"
  avd_name:
    type: string
    default: "termix-test"
    description: "Nom de l'AVD créé"
  avd_ram:
    type: string
    default: "4096"
    description: "RAM allouée à l'AVD, en Mo"
  gpu_mode:
    type: string
    default: "swiftshader_indirect"
    description: "Rendu de l'émulateur : 'swiftshader_indirect' (défaut, logiciel, aucun GPU requis) ou 'host' pour exploiter un GPU en passthrough — dans ce cas /dev/dri est vérifié en précondition et l'installation est refusée s'il manque"
  headless:
    type: string
    default: "1"
    description: "1 (défaut) = émulateur sans fenêtre. Indépendant du rendu : une machine avec GPU en passthrough n'a pas forcément d'écran. Mettre 0 exige un DISPLAY valide"
  node_major:
    type: string
    default: "20"
    description: "Version majeure de Node installée via NodeSource — Expo 54 exige 20 minimum, le paquet Debian 12 (18) ne convient pas"
  repo_url:
    type: string
    default: "https://github.com/gaelgael5/Termix-mobile.git"
    description: "Dépôt de l'application à cloner et builder"
  repo_ref:
    type: string
    default: "test/unit-test-foundation"
    description: "Branche ou tag à cloner"
  workdir:
    type: string
    default: ""
    description: "Répertoire de travail du dépôt (vide = ~/termix-mobile)"
  skip_android:
    type: string
    default: "0"
    description: "1 pour ne pas installer JDK/SDK/NDK/AVD"
  skip_node:
    type: string
    default: "0"
    description: "1 pour ne pas installer Node"
  skip_emulator:
    type: string
    default: "0"
    description: "1 pour ne pas démarrer l'émulateur"
  skip_build:
    type: string
    default: "0"
    description: "1 pour ne pas cloner le dépôt ni builder l'application"
  enable_scrcpy:
    type: string
    default: "1"
    description: "1 (défaut) pour installer ws-scrcpy : l'écran de l'émulateur dans un navigateur, avec clics et glissements — seul moyen de voir l'app sur une machine sans écran. ATTENTION : ce service n'a AUCUNE authentification ni chiffrement et écoute sur toutes les interfaces (son schéma de configuration n'expose pas d'adresse d'écoute) ; le contenir demande une règle de pare-feu. Mettre 0 pour ne pas l'installer"
  scrcpy_port:
    type: string
    default: "8000"
    description: "Port d'écoute de ws-scrcpy"
  scrcpy_dir:
    type: string
    default: ""
    description: "Répertoire d'installation de ws-scrcpy (vide = ~/ws-scrcpy)"
